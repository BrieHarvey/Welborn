<!doctype html>
<!--
  Source for public/og-image.png (the social sharing card, 1200 × 630).
  Regenerate after editing — see README, "Regenerating the social image".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        src: url('../public/fonts/schibsted-grotesk-variable.woff2') format('woff2-variations');
        font-weight: 400 900;
        font-display: block;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; }

      body {
        background:
          radial-gradient(90% 120% at 85% 0%, rgba(13, 146, 184, 0.5) 0%, transparent 62%),
          #083e4e;
        font-family: 'Schibsted Grotesk', 'Liberation Sans', Helvetica, Arial, sans-serif;
        color: #fff;
      }

      /* The practice artwork sits behind the card, faded in from the right so
         it never crowds the headline. Same file the website uses. */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 58px 76px;
        overflow: hidden;
        background-image:
          linear-gradient(100deg, #083e4e 22%, rgba(8, 62, 78, 0) 74%),
          url('../public/images/art-arcs-wide.svg');
        background-size: cover, cover;
        background-position: center, center;
      }

      .grain {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 92px);
      }

      .top {
        position: relative;
        display: flex;
        align-items: center;
        gap: 19px;
        height: 54px;
      }

      /* The logo on a white tile — the mark has white gaps in it, so it
         cannot sit straight on the dark card. */
      .lockup {
        height: 54px; width: auto; display: block;
        padding: 13px 17px; background: #fff; border-radius: 10px;
        box-sizing: content-box;
      }

      .middle { position: relative; margin-top: 46px; }

      .rule {
        width: 84px;
        height: 3px;
        background: rgba(255, 255, 255, 0.85);
        margin-bottom: 26px;
      }

      .headline {
        font-size: 54px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.03em;
        max-width: 18ch;
      }

      .bottom {
        position: relative;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 40px;
        margin-top: 46px;
        padding-top: 26px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }

      .doctor {
        font-size: 25px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.012em;
      }

      .specialty {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.4;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
      }

      .location {
        text-align: right;
        font-size: 18px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.72);
      }

      .location strong {
        display: block;
        font-weight: 600;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grain"></div>

      <div class="top">
        <img class="lockup" src="../public/images/logo-horizontal.svg" alt="" />
      </div>

      <div class="middle">
        <div class="rule"></div>
        <h1 class="headline">Restoring Movement. Relieving Pain. Improving Lives.</h1>
      </div>

      <div class="bottom">
        <div>
          <div class="doctor">John Hearst Welborn, MD</div>
          <div class="specialty">Orthopaedic Surgery</div>
        </div>
        <div class="location">
          <strong>Pinole, California</strong>
          (510) 724-4600
        </div>
      </div>
    </div>
  </body>
</html>
