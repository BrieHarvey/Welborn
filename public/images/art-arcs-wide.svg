<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="presentation">
  <!--
    Welborn Orthopedics — brand artwork, landscape.
    Layered arcs sweeping upward: range of motion restored. Echoes the arc
    geometry of the practice mark. Abstract on purpose — no stock photography,
    nothing that dates. Replace with a real photograph when one is available.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="1" x2="0.85" y2="0">
      <stop offset="0%" stop-color="#12232C"/>
      <stop offset="48%" stop-color="#1E3A49"/>
      <stop offset="100%" stop-color="#33566B"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.16" r="0.72">
      <stop offset="0%" stop-color="#8FB3C6" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#5A7C90" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12232C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CFE0EA" stop-opacity="0"/>
      <stop offset="30%" stop-color="#CFE0EA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CFE0EA" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="arcFadeSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FC0D2" stop-opacity="0"/>
      <stop offset="42%" stop-color="#9FC0D2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9FC0D2" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#ground)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Wide sweeping arcs, weighted so the eye travels bottom-left to upper-right -->
  <g fill="none" stroke-linecap="round">
    <path d="M-60 720 C 240 700, 520 590, 700 400 C 830 262, 980 168, 1260 118"
          stroke="url(#arcFade)" stroke-width="2.4"/>
    <path d="M-60 790 C 280 770, 590 650, 780 442 C 916 292, 1050 200, 1260 168"
          stroke="url(#arcFadeSoft)" stroke-width="1.6"/>
    <path d="M-60 650 C 210 628, 460 528, 628 356 C 748 232, 900 140, 1260 78"
          stroke="url(#arcFadeSoft)" stroke-width="1.3"/>
    <path d="M-60 862 C 320 842, 660 712, 858 486 C 1000 324, 1120 236, 1260 214"
          stroke="#CFE0EA" stroke-opacity="0.14" stroke-width="1.1"/>
  </g>

  <!-- Concentric articulation, upper right — the pivot the arcs travel around -->
  <g fill="none" stroke="#CFE0EA" transform="translate(902 236)">
    <circle r="58"  stroke-opacity="0.30" stroke-width="1.5"/>
    <circle r="104" stroke-opacity="0.17" stroke-width="1.2"/>
    <circle r="158" stroke-opacity="0.09" stroke-width="1"/>
    <circle r="7"   fill="#CFE0EA" fill-opacity="0.55" stroke="none"/>
  </g>

  <!-- Quiet horizon rules for depth -->
  <g stroke="#CFE0EA" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 300 H1200"/>
    <path d="M0 540 H1200"/>
  </g>

  <rect width="1200" height="800" filter="url(#grain)" opacity="0.5"/>
</svg>
