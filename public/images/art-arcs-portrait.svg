<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="presentation">
  <!--
    Welborn Orthopedics — brand artwork, portrait.
    Used behind the practice mark where a photograph of Dr. Welborn will go.
    Same arc language as the landscape piece, composed vertically.
  -->
  <defs>
    <linearGradient id="pGround" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#04262F"/>
      <stop offset="52%" stop-color="#083E4E"/>
      <stop offset="100%" stop-color="#116A85"/>
    </linearGradient>

    <radialGradient id="pGlow" cx="0.72" cy="0.22" r="0.78">
      <stop offset="0%" stop-color="#43A4A4" stop-opacity="0.38"/>
      <stop offset="58%" stop-color="#43A4A4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#04262F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pArc" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#BFE7E7" stop-opacity="0"/>
      <stop offset="38%" stop-color="#BFE7E7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#BFE7E7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pArcSoft" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0%" stop-color="#7ABC8D" stop-opacity="0"/>
      <stop offset="46%" stop-color="#7ABC8D" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7ABC8D" stop-opacity="0"/>
    </linearGradient>

    <filter id="pGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#pGround)"/>
  <rect width="1000" height="1250" fill="url(#pGlow)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-40 1180 C 180 1090, 330 880, 380 610 C 424 372, 560 190, 1040 96"
          stroke="url(#pArc)" stroke-width="2.2"/>
    <path d="M-40 1290 C 230 1190, 420 960, 476 668 C 524 414, 660 236, 1040 158"
          stroke="url(#pArcSoft)" stroke-width="1.5"/>
    <path d="M-40 1064 C 148 984, 268 800, 306 566 C 344 344, 470 168, 1040 44"
          stroke="url(#pArcSoft)" stroke-width="1.2"/>
  </g>

  <g fill="none" stroke="#BFE7E7" transform="translate(690 342)">
    <circle r="72"  stroke-opacity="0.24" stroke-width="1.4"/>
    <circle r="132" stroke-opacity="0.13" stroke-width="1.1"/>
    <circle r="204" stroke-opacity="0.07" stroke-width="1"/>
  </g>

  <g stroke="#BFE7E7" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 470 H1000"/>
    <path d="M0 840 H1000"/>
  </g>

  <rect width="1000" height="1250" filter="url(#pGrain)" opacity="0.5"/>
</svg>
